<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paciência — Klondike</title>
<style>
  :root {
    --cw: clamp(52px, calc((100vw - 48px) / 7.6), 96px);   /* largura da carta */
    --ch: calc(var(--cw) * 1.4);                            /* altura 5:7 */
    --gap: max(8px, calc((100vw - 48px - var(--cw) * 7) / 6));
    --felt1: #2e7d4f;
    --felt2: #1d5434;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 20%, var(--felt1), var(--felt2) 75%);
    min-height: 100vh;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 14px 24px 6px;
  }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; margin-right: 12px; }
  button {
    background: #f7f3e3; color: #2c2a20; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 4px rgba(0,0,0,.3);
    transition: transform .08s, background .15s;
  }
  button:hover { background: #fff; transform: translateY(-1px); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  button.toggle.active { background: #ffd166; }
  .stats { margin-left: auto; display: flex; gap: 16px; font-size: 13px; opacity: .95; }
  .stats b { font-weight: 700; }

  #board {
    display: flex; flex-direction: column; gap: 26px;
    padding: 18px 24px 60px;
  }
  .row { display: flex; gap: var(--gap); }

  .slot, .pile {
    width: var(--cw);
    border-radius: 10px;
  }
  .slot {
    height: var(--ch);
    border: 2px dashed rgba(255,255,255,.35);
    background: rgba(0,0,0,.12);
    position: relative;
    flex: 0 0 var(--cw);
  }
  .slot .label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cw) * .5); opacity: .5;
  }
  .slot .findex { position: absolute; top: 4px; left: 6px; font-size: 11px; opacity: .5; }
  .slot.stock { cursor: pointer; }

  .toprow { align-items: flex-start; }
  .spacer { flex: 1; }

  .pile {
    position: relative;
    height: var(--ch); /* mínimo; cresce com as cartas */
  }
  .pile.tableau { min-height: var(--ch); }

  .card {
    position: absolute; left: 0; width: var(--cw); height: var(--ch);
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,.35);
    will-change: top;
  }
  .card .inner { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; }
  .card.face-up { background: #fdfdfa; border: 1px solid #b9b6a8; }
  .card.face-up .inner { background: #fdfdfa; }
  .card.face-down {
    background: #26457c;
    border: 1px solid #14264a;
  }
  .card.face-down .inner {
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 6px, transparent 6px 12px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.10) 0 6px, transparent 6px 12px),
      linear-gradient(#2d4f8f, #21386b);
  }
  .card .corner {
    position: absolute;
    display: flex; flex-direction: column; align-items: center; line-height: 1.05;
    font-weight: 700;
  }
  .card .corner .r { font-size: calc(var(--cw) * .26); }
  .card .corner .s { font-size: calc(var(--cw) * .24); }
  .card .corner.tl { top: 5px; left: 6px; }
  .card .corner.br { bottom: 5px; right: 6px; transform: rotate(180deg); }
  .card .bigpip {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cw) * .62);
    opacity: .9;
  }
  .card.red { color: #c62f3e; }
  .card.black { color: #22252c; }

  .card.dragging { opacity: .45; }
  .card.ondrop-ok { box-shadow: 0 0 0 3px #ffd166, 0 2px 6px rgba(0,0,0,.4); }

  .pile.drop-ok .slot, .slot.drop-ok {
    border-color: #ffd166; background: rgba(255,209,102,.18);
  }

  /* overlay de vitória */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #overlay.show { display: flex; }
  #overlay .panel {
    background: linear-gradient(#fdfdfa, #efe9d8);
    color: #2c2a20; border-radius: 16px; padding: 34px 44px; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    animation: pop .3s ease;
  }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #overlay h2 { font-size: 30px; margin-bottom: 10px; }
  #overlay p { margin: 4px 0 18px; font-size: 15px; }

  .hint {
    text-align: center; font-size: 12px; opacity: .7; padding: 0 0 26px;
  }
</style>
</head>
<body>

<header>
  <h1>♠ Paciência</h1>
  <button id="btn-new">Novo jogo</button>
  <button id="btn-undo" disabled>Desfazer</button>
  <button id="btn-auto">Completar</button>
  <button id="btn-draw" class="toggle" title="Alternar entre retirar 1 ou 3 cartas">Retirar: 1</button>
  <div class="stats">
    <span>⏱ <b id="st-time">0:00</b></span>
    <span>Jogadas: <b id="st-moves">0</b></span>
    <span>Pontos: <b id="st-score">0</b></span>
  </div>
</header>

<div id="board">
  <div class="row toprow">
    <div class="slot stock" id="stock-slot" title="Clique para retirar do monte"></div>
    <div class="pile" id="waste-pile" data-zone="waste"></div>
    <div class="spacer"></div>
    <div class="pile" id="f0" data-zone="f" data-pile="0"></div>
    <div class="pile" id="f1" data-zone="f" data-pile="1"></div>
    <div class="pile" id="f2" data-zone="f" data-pile="2"></div>
    <div class="pile" id="f3" data-zone="f" data-pile="3"></div>
  </div>
  <div class="row" id="tableau-row">
    <div class="pile tableau" data-zone="t" data-pile="0"></div>
    <div class="pile tableau" data-zone="t" data-pile="1"></div>
    <div class="pile tableau" data-zone="t" data-pile="2"></div>
    <div class="pile tableau" data-zone="t" data-pile="3"></div>
    <div class="pile tableau" data-zone="t" data-pile="4"></div>
    <div class="pile tableau" data-zone="t" data-pile="5"></div>
    <div class="pile tableau" data-zone="t" data-pile="6"></div>
  </div>
</div>

<p class="hint">Arraste cartas entre pilhas • Duplo clique envia para a fundação • No monte, clique para retirar</p>

<div id="overlay">
  <div class="panel">
    <h2>🎉 Você venceu!</h2>
    <p id="win-stats"></p>
    <button id="btn-again">Jogar novamente</button>
  </div>
</div>

<script>
"use strict";
/* ============================ Modelo ============================ */
const SUITS = ["♠", "♥", "♦", "♣"];           // 0..3
const isRed = s => s === 1 || s === 2;
const RANK_TXT = { 1: "A", 11: "J", 12: "Q", 13: "K" };
const rankTxt = r => (r >= 2 && r <= 10) ? String(r) : RANK_TXT[r];

let state, undoStack = [], timerId = null, seconds = 0, started = false;

function freshState() {
  return {
    stock: [], waste: [],
    foundations: [[], [], [], []],
    tableau: [[], [], [], [], [], [], []],
    moves: 0, score: 0, drawCount: 1, won: false,
  };
}

function buildDeck() {
  const d = [];
  let id = 0;
  for (let s = 0; s < 4; s++)
    for (let r = 1; r <= 13; r++)
      d.push({ id: id++, suit: s, rank: r, faceUp: false });
  // embaralhamento Fisher–Yates
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}

function newGame() {
  const s = freshState();
  s.drawCount = state ? state.drawCount : 1;
  const deck = buildDeck();
  for (let i = 0; i < 7; i++) {
    for (let j = 0; j <= i; j++) {
      const c = deck.pop();
      c.faceUp = (j === i);
      s.tableau[i].push(c);
    }
  }
  s.stock = deck; // todas viradas para baixo
  state = s;
  undoStack = [];
  seconds = 0; started = false;
  if (timerId) clearInterval(timerId);
  document.getElementById("overlay").classList.remove("show");
  render();
}

/* ======================= Regras do jogo ========================= */
function topOf(pile) { return pile[pile.length - 1]; }

function canOnTableau(card, pile) {
  const t = topOf(pile);
  if (!t) return card.rank === 13;                       // só rei em pilha vazia
  return t.faceUp && isRed(t.suit) !== isRed(card.suit) && card.rank === t.rank - 1;
}
function canOnFoundation(card, pile) {
  const t = topOf(pile);
  if (!t) return card.rank === 1;                       // só áss em fundação vazia
  return t.suit === card.suit && card.rank === t.rank + 1;
}
function foundationFor(card) {
  for (let i = 0; i < 4; i++)
    if (canOnFoundation(card, state.foundations[i])) return i;
  return -1;
}

function snapshot() {
  return JSON.parse(JSON.stringify({
    stock: state.stock, waste: state.waste,
    foundations: state.foundations, tableau: state.tableau,
    moves: state.moves, score: state.score,
  }));
}
function pushUndo() {
  undoStack.push(snapshot());
  if (undoStack.length > 400) undoStack.shift();
}

/* ========================== Ações =============================== */
function startTimerIfNeeded() {
  if (started || state.won) return;
  started = true;
  timerId = setInterval(() => {
    seconds++;
    updateStats();
  }, 1000);
}

function doMove(src, srcIdx, dst, dstPile) {
  // src/dst: {zone, pile}; srcIdx: índice da 1ª carta a mover (na fundação/tabela)
  pushUndo();
  const srcArr = zoneArr(src.zone, src.pile);
  const moving = srcArr.splice(srcIdx);
  const dstArr = zoneArr(dst.zone, dst.pile);
  dstArr.push(...moving);

  state.moves++;
  if (dst.zone === "f") state.score += 10;
  else if (src.zone === "waste") state.score += 5;
  else if (src.zone === "t" && dst.zone === "waste") state.score += 15;

  // virar carta que ficou exposta na mesa
  if (src.zone === "t") {
    const t = topOf(srcArr);
    if (t && !t.faceUp) { t.faceUp = true; state.score += 50; }
  }
  startTimerIfNeeded();
  render();
  checkWin();
}

function zoneArr(zone, pile) {
  if (zone === "stock") return state.stock;
  if (zone === "waste") return state.waste;
  if (zone === "f") return state.foundations[pile];
  return state.tableau[pile];
}

function clickStock() {
  if (state.won) return;
  if (state.stock.length) {
    pushUndo();
    const n = Math.min(state.drawCount, state.stock.length);
    for (let i = 0; i < n; i++) {
      const c = state.stock.pop();
      c.faceUp = true;
      state.waste.push(c);
    }
    state.moves++;
    startTimerIfNeeded();
    render();
  } else if (state.waste.length) {
    // reciclar o descarte de volta ao monte
    pushUndo();
    while (state.waste.length) {
      const c = state.waste.pop();
      c.faceUp = false;
      state.stock.push(c);
    }
    state.moves++;
    startTimerIfNeeded();
    render();
  }
}

function tryAutoToFoundation(zone, pile, idx) {
  const arr = zoneArr(zone, pile);
  const c = arr[idx];
  if (!c || !c.faceUp) return false;
  // só a pilha inteira a partir de idx pode ir (na prática, apenas o topo)
  if (idx !== arr.length - 1) return false;
  const f = foundationFor(c);
  if (f === -1) return false;
  doMove({ zone, pile }, idx, { zone: "f", pile: f });
  return true;
}

function undo() {
  const s = undoStack.pop();
  if (!s) return;
  state.stock = s.stock; state.waste = s.waste;
  state.foundations = s.foundations; state.tableau = s.tableau;
  state.moves = s.moves; state.score = s.score;
  if (state.won) { state.won = false; }
  render();
}

function canAutoComplete() {
  // simulação: só é "seguro" se cada carta exposta tiver caminho para a fundação
  const sim = JSON.parse(JSON.stringify({
    foundations: state.foundations, tableau: state.tableau, waste: state.waste,
  }));
  let progress = true;
  while (progress) {
    progress = false;
    const zones = sim.tableau.map((_, i) => ["t", i]).concat([["waste", 0]]);
    for (const [zone, i] of zones) {
      const arr = zone === "waste" ? sim.waste : sim.tableau[i];
      const t = topOf(arr);
      if (!t) continue;
      if (!t.faceUp) { t.faceUp = true; progress = true; continue; }
      for (let f = 0; f < 4; f++) {
        if (canOnFoundation(t, sim.foundations[f])) {
          sim.foundations[f].push(arr.pop());
          progress = true;
          break;
        }
      }
    }
  }
  return sim.foundations.reduce((n, f) => n + f.length, 0) === 52;
}

function autoComplete() {
  if (!canAutoComplete()) return;
  const step = () => {
    let moved = false;
    // primeiras as fundações vazias por ordem natural
    const sources = [];
    state.tableau.forEach((p, i) => sources.push(["t", i]));
    if (state.waste.length) sources.push(["waste", 0]);
    for (const [zone, i] of sources) {
      if (tryAutoToFoundation(zone, i, zoneArr(zone, i).length - 1)) { moved = true; break; }
    }
    if (!moved) return;
    setTimeout(step, 160);
  };
  step();
}

function checkWin() {
  if (state.foundations.every(f => f.length === 13)) {
    state.won = true;
    if (timerId) clearInterval(timerId);
    const mins = Math.floor(seconds / 60), secs = seconds % 60;
    document.getElementById("win-stats").textContent =
      `Tempo: ${mins}:${String(secs).padStart(2, "0")}  •  Jogadas: ${state.moves}  •  Pontos: ${state.score}`;
    document.getElementById("overlay").classList.add("show");
  }
}

/* =========================== Render ============================= */
const board = document.getElementById("board");
const stockSlot = document.getElementById("stock-slot");

function cardEl(card, top, faceUp) {
  const el = document.createElement("div");
  el.className = `card ${faceUp ? "face-up" : "face-down"} ${faceUp ? (isRed(card.suit) ? "red" : "black") : ""}`;
  el.style.top = top + "px";
  if (faceUp) {
    el.draggable = true;
    el.innerHTML =
      `<div class="inner">
         <div class="corner tl"><span class="r">${rankTxt(card.rank)}</span><span class="s">${SUITS[card.suit]}</span></div>
         <div class="bigpip">${SUITS[card.suit]}</div>
         <div class="corner br"><span class="r">${rankTxt(card.rank)}</span><span class="s">${SUITS[card.suit]}</span></div>
       </div>`;
  } else {
    el.innerHTML = `<div class="inner"></div>`;
  }
  return el;
}

function cardMetrics() {
  const cw = document.querySelector(".card, .slot");
  const w = cw ? cw.getBoundingClientRect().width : 90;
  return { w, up: w * 0.30, down: w * 0.13 };
}

function renderPile(pileEl, cards, allowEmptyDrop) {
  const { up, down } = cardMetrics();
  // limpar cartas antigas (manter slot-fantasma de fundo se existir)
  [...pileEl.querySelectorAll(".card")].forEach(n => n.remove());
  if (pileEl.querySelector(".slot") === null) {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.style.position = "absolute";
    slot.style.inset = "0";
    slot.style.pointerEvents = "none";
    if (allowEmptyDrop) slot.style.borderStyle = "dashed";
    pileEl.prepend(slot);
  }
  let top = 0;
  cards.forEach((c, i) => {
    if (i > 0) top += (c.faceUp ? up : down);
    const el = cardEl(c, top, c.faceUp);
    el.dataset.zone = pileEl.dataset.zone;
    el.dataset.pile = pileEl.dataset.pile;
    el.dataset.index = i;
    pileEl.appendChild(el);
  });
  // altura da pilha acompanha as cartas
  const h = pileEl.querySelector(".slot").getBoundingClientRect().height;
  pileEl.style.height = Math.max(h, top + (cards.length ? up : 0)) + "px";
}

function render() {
  // monte de estoque
  stockSlot.innerHTML = "";
  const st = state.stock;
  if (st.length) {
    const back = cardEl(st[0], 0, false);
    back.style.position = "absolute";
    back.style.inset = 0;
    stockSlot.appendChild(back);
    stockSlot.dataset.hasCards = "1";
  } else {
    stockSlot.dataset.hasCards = "0";
    stockSlot.innerHTML = `<span class="label" style="font-size:26px">↺</span>`;
  }

  // descarte: mostra até 3 cartas empilhadas (última no topo)
  const wasteEl = document.getElementById("waste-pile");
  renderPile(wasteEl, state.waste, false);
  const { up } = cardMetrics();
  wasteEl.style.height = Math.max(
    wasteEl.querySelector(".slot").getBoundingClientRect().height,
    up) + "px";

  // fundações
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById("f" + i);
    renderPile(el, state.foundations[i], false);
    const slot = el.querySelector(".slot");
    const f = state.foundations[i];
    const label = slot.querySelector(".label");
    if (!f.length) {
      slot.style.borderStyle = "dashed";
      if (!label) {
        const l = document.createElement("span");
        l.className = "label";
        l.textContent = SUITS[i];
        slot.appendChild(l);
      }
    } else {
      slot.style.borderStyle = "solid";
    }
  }

  // mesa
  document.querySelectorAll("#tableau-row .pile").forEach((el, i) => {
    renderPile(el, state.tableau[i], true);
  });

  // destacar pilhas onde o arrasto atual é válido
  highlightDropZones();

  // stats
  updateStats();
  document.getElementById("btn-undo").disabled = !undoStack.length || state.won;
  document.getElementById("btn-auto").disabled = state.won || !canAutoComplete();
  document.getElementById("btn-draw").textContent = "Retirar: " + state.drawCount;
  document.getElementById("btn-draw").classList.toggle("active", state.drawCount === 3);
}

function updateStats() {
  const mins = Math.floor(seconds / 60), secs = seconds % 60;
  document.getElementById("st-time").textContent = `${mins}:${String(secs).padStart(2, "0")}`;
  document.getElementById("st-moves").textContent = state.moves;
  document.getElementById("st-score").textContent = state.score;
}

/* ====================== Drag & drop ============================ */
let dragInfo = null; // {zone, pile, index}

function highlightDropZones() {
  document.querySelectorAll(".card, .slot, .pile").forEach(n =>
    n.classList.remove("drop-ok", "ondrop-ok"));
  if (!dragInfo) return;
  const cards = zoneArr(dragInfo.zone, dragInfo.pile).slice(dragInfo.index);
  const first = cards[0];
  if (!first || !first.faceUp) return;
  const f = foundationFor(first);
  const targets = [];
  if (cards.length === 1 && f !== -1) targets.push(`#f${f}`);
  if (dragInfo.zone === "waste" || dragInfo.zone === "t") {
    for (let i = 0; i < 7; i++) {
      if (dragInfo.zone === "t" && i === dragInfo.pile) continue;
      if (canOnTableau(first, state.tableau[i])) targets.push(`#tableau-row .pile:nth-child(${i + 1})`);
    }
    targets.push("#waste-pile");
  }
  for (const sel of targets) {
    const el = document.querySelector(sel);
    if (el) el.classList.add("drop-ok");
  }
}

board.addEventListener("dragstart", e => {
  const cardElN = e.target.closest(".card");
  if (!cardElN || !cardElN.classList.contains("face-up") || state.won) {
    e.preventDefault(); return;
  }
  dragInfo = {
    zone: cardElN.dataset.zone,
    pile: +cardElN.dataset.pile,
    index: +cardElN.dataset.index,
  };
  e.dataTransfer.setData("text/plain", "card");
  e.dataTransfer.effectAllowed = "move";
  cardElN.classList.add("dragging");
  // dar tempo para o navegador capturar a imagem antes do re-render
  setTimeout(() => {
    cardElN.classList.remove("dragging");
    highlightDropZones();
  }, 0);
});

board.addEventListener("dragend", e => {
  const cardElN = e.target.closest(".card");
  if (cardElN) cardElN.classList.remove("dragging");
  dragInfo = null;
  highlightDropZones();
});

board.addEventListener("dragover", e => {
  if (!dragInfo) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
});

board.addEventListener("drop", e => {
  if (!dragInfo) return;
  e.preventDefault();
  const slot = e.target.closest(".pile, .slot");
  if (!slot) return;
  const dst = { zone: slot.dataset.zone, pile: slot.dataset.pile === undefined ? undefined : +slot.dataset.pile };
  if (!dst.zone) return;

  const srcArr = zoneArr(dragInfo.zone, dragInfo.pile);
  const moving = srcArr.slice(dragInfo.index);
  const first = moving[0];
  if (!first || !first.faceUp) return;

  let ok = false, dstPile = dst.pile;
  if (dst.zone === "f") {
    ok = (moving.length === 1) && canOnFoundation(first, state.foundations[dst.pile]);
  } else if (dst.zone === "t") {
    if (dragInfo.zone === "t" && dst.pile === dragInfo.pile) { ok = false; }
    else if (dragInfo.zone === "waste") { ok = moving.length === 1 && canOnTableau(first, state.tableau[dst.pile]); }
    else { ok = canOnTableau(first, state.tableau[dst.pile]); }
  } else if (dst.zone === "waste") {
    // só devolve à fila quando vinda da mesa
    ok = (dragInfo.zone === "t") && moving.length === srcArr.length && canReturnToWaste(srcArr);
  } else return;

  if (ok) doMove({ zone: dragInfo.zone, pile: dragInfo.pile }, dragInfo.index, dst);
  dragInfo = null;
});

function canReturnToWaste(srcArr) {
  // regra clássica: pilha da mesa retorna à fila (sem regra extra)
  return true;
}

/* Clique / duplo clique */
stockSlot.addEventListener("click", clickStock);

board.addEventListener("dblclick", e => {
  const cardElN = e.target.closest(".card");
  if (!cardElN || state.won) return;
  const zone = cardElN.dataset.zone;
  const pile = +cardElN.dataset.pile;
  const index = +cardElN.dataset.index;
  if (zone === "waste") {
    if (index === state.waste.length - 1) tryAutoToFoundation("waste", 0, index);
  } else if (zone === "t") {
    if (index === state.tableau[pile].length - 1) tryAutoToFoundation("t", pile, index);
  }
});

/* virar carta coberta clicando nela */
board.addEventListener("click", e => {
  const cardElN = e.target.closest(".card");
  if (!cardElN || state.won) return;
  if (cardElN.classList.contains("face-down") && cardElN.dataset.zone === "t") {
    const arr = state.tableau[+cardElN.dataset.pile];
    const idx = +cardElN.dataset.index;
    if (idx === arr.length - 1) {
      pushUndo();
      const c = arr[idx];
      c.faceUp = true;
      state.score += 50;
      state.moves++;
      startTimerIfNeeded();
      render();
    }
  }
});

/* =========================== Botões ============================ */
document.getElementById("btn-new").addEventListener("click", newGame);
document.getElementById("btn-again").addEventListener("click", newGame);
document.getElementById("btn-undo").addEventListener("click", undo);
document.getElementById("btn-auto").addEventListener("click", autoComplete);
document.getElementById("btn-draw").addEventListener("click", () => {
  state.drawCount = state.drawCount === 1 ? 3 : 1;
  render();
});

/* resize: re-renderiza para ajustar offsets */
let resizeTO;
window.addEventListener("resize", () => {
  clearTimeout(resizeTO);
  resizeTO = setTimeout(render, 150);
});

newGame();
</script>
