<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macintosh · 1984</title>
<style>
  :root{
    --beige:#d8cfc0; --beige-dark:#b8ad9a; --beige-darker:#948a76; --beige-light:#eae3d6;
    --screen-black:#1a1a1a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;}
  body{
    background:#3f3b45;
    background-image:radial-gradient(ellipse at 50% 30%, #56515e 0%, #3f3b45 60%, #2c2931 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:Chicago,"Charcoal","Geneva","Helvetica Neue",Helvetica,Arial,sans-serif;
    overflow:hidden;
  }

  /* ============ THE MACHINE ============ */
  #machine{
    position:relative;
    background:linear-gradient(175deg,var(--beige-light) 0%,var(--beige) 55%,var(--beige-dark) 100%);
    border-radius:14px;
    padding:34px 38px 14px;
    box-shadow:
      inset 2px 2px 3px rgba(255,255,255,.6),
      inset -3px -6px 8px rgba(0,0,0,.18),
      0 30px 60px rgba(0,0,0,.55),
      0 8px 16px rgba(0,0,0,.4);
    transform-origin:center center;
  }
  #bezel{
    background:linear-gradient(180deg,var(--beige-dark),var(--beige-darker));
    border-radius:8px;
    padding:14px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.45), inset 0 -1px 2px rgba(255,255,255,.25);
  }
  #crt{
    position:relative;
    width:calc(512px * var(--s,1.35));
    height:calc(342px * var(--s,1.35));
    background:var(--screen-black);
    border-radius:6px;
    overflow:hidden;
    box-shadow:inset 0 0 30px rgba(0,0,0,.9);
  }
  #screen{
    position:absolute;top:0;left:0;
    width:512px;height:342px;
    transform:scale(var(--s,1.35));
    transform-origin:top left;
    background:#000;
    cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><path d="M1 1 L1 13 L4 10 L6 15 L8 14 L6 9 L10 9 Z" fill="black" stroke="white" stroke-width="1"/></svg>') 1 1, default;
  }
  #glass{
    position:absolute;inset:0;pointer-events:none;border-radius:6px;
    background:
      radial-gradient(ellipse 120% 90% at 30% 15%, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 42%),
      radial-gradient(ellipse 150% 120% at 50% 50%, rgba(0,0,0,0) 72%, rgba(0,0,0,.35) 100%);
  }
  #chin{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 6px 6px;
  }
  #brand{
    font-size:13px;letter-spacing:.4px;color:#6d6355;
    text-shadow:0 1px 0 rgba(255,255,255,.55);
    font-style:normal;font-weight:400;
  }
  #brand b{font-weight:700;}
  #floppy{
    width:150px;height:10px;border-radius:3px;
    background:linear-gradient(180deg,#7f7565,#5d5546 40%,#8d8371);
    box-shadow:inset 0 2px 3px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.5);
    position:relative;
  }
  #floppy::after{content:"";position:absolute;right:14px;top:2px;width:26px;height:6px;border-radius:2px;
    background:rgba(0,0,0,.35);}

  /* power switch */
  #power-wrap{
    position:absolute;right:-26px;bottom:110px;width:26px;height:86px;
    background:linear-gradient(90deg,var(--beige-dark),var(--beige-darker));
    border-radius:0 8px 8px 0;
    box-shadow:inset -2px 0 4px rgba(0,0,0,.35), 4px 4px 10px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
  }
  #power{
    width:14px;height:52px;border:none;border-radius:4px;cursor:pointer;
    background:linear-gradient(180deg,#efe9dd 0%,#cfc5b2 50%,#a89d88 50%,#c4b9a4 100%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.7), inset 0 -2px 3px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.4);
    transition:background .15s;
  }
  #power.on{background:linear-gradient(180deg,#a89d88 0%,#c4b9a4 50%,#efe9dd 50%,#cfc5b2 100%);}
  #power-label{
    position:absolute;right:-22px;bottom:82px;color:#5d5546;font-size:9px;letter-spacing:1px;
    writing-mode:vertical-rl;opacity:.8;
  }
  #hint{
    position:absolute;left:50%;bottom:-46px;transform:translateX(-50%);
    color:#bdb7c7;font-size:13px;letter-spacing:.3px;white-space:nowrap;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* ============ IN-SCREEN (512×342 coordinate space) ============ */
  .scene{position:absolute;inset:0;display:none;}
  .scene.active{display:block;}
  #scene-boot{background:#fff;}
  #boot-icon{
    position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    image-rendering:pixelated;
  }
  #boot-msg{
    position:absolute;left:0;right:0;top:66%;text-align:center;
    font-size:18px;font-weight:700;color:#000;letter-spacing:.5px;
  }

  #scene-desktop{
    background:#fff;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="2" height="2"><rect width="2" height="2" fill="white"/><rect x="0" y="0" width="1" height="1" fill="black"/><rect x="1" y="1" width="1" height="1" fill="black"/></svg>');
    background-size:2px 2px;
  }

  /* menu bar */
  #menubar{
    position:absolute;top:0;left:0;right:0;height:19px;
    background:#fff;border-bottom:1px solid #000;
    display:flex;align-items:center;gap:0;
    font-size:12px;font-weight:700;z-index:5000;
    padding-left:8px;
  }
  .menu-title{padding:2px 9px 3px;cursor:default;line-height:14px;position:relative;}
  .menu-title.open{background:#000;color:#fff;}
  .dropdown{
    position:absolute;top:19px;background:#fff;border:1px solid #000;color:#000;font-weight:700;
    box-shadow:2px 2px 0 #000;min-width:150px;z-index:6000;display:none;
    padding:2px 0;
  }
  .dropdown.show{display:block;}
  .mi{padding:3px 22px 3px 14px;font-size:12px;font-weight:700;white-space:nowrap;cursor:default;}
  .mi:hover{background:#000;color:#fff;}
  .mi.dim{color:#888;}
  .mi.dim:hover{background:#fff;color:#888;}
  .msep{height:1px;margin:3px 1px;background:repeating-linear-gradient(90deg,#000 0 1px,#fff 1px 2px);}

  /* desktop icons */
  .dicon{
    position:absolute;width:66px;text-align:center;cursor:default;z-index:10;
  }
  .dicon .pic{display:inline-block;image-rendering:pixelated;}
  .dicon .lbl{
    display:inline-block;margin-top:2px;font-size:10px;font-weight:700;background:#fff;color:#000;
    padding:0 3px;line-height:12px;
  }
  .dicon.sel .pic{filter:invert(1);}
  .dicon.sel .lbl{background:#000;color:#fff;}

  /* windows */
  .win{
    position:absolute;background:#fff;border:1px solid #000;
    box-shadow:1px 1px 0 #000;
    display:flex;flex-direction:column;z-index:100;
  }
  .tbar{
    height:19px;border-bottom:1px solid #000;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:#fff;flex:none;cursor:default;
  }
  .win.front .tbar{
    background:repeating-linear-gradient(180deg,#fff 0 1px,#000 1px 2px,#fff 2px 3px,#000 3px 4px,#fff 4px 5px,#000 5px 6px,#fff 6px 7px,#000 7px 8px,#fff 8px 9px,#000 9px 10px,#fff 10px 11px,#000 11px 12px,#fff 12px 13px,#000 13px 14px,#fff 14px 15px,#000 15px 16px,#fff 16px 17px,#000 17px 18px,#fff 18px 19px);
  }
  .tbar .ttl{
    font-size:12px;font-weight:700;background:#fff;padding:0 8px;line-height:17px;z-index:1;
  }
  .closebox{
    position:absolute;left:8px;top:3px;width:11px;height:11px;background:#fff;border:1px solid #000;
    display:none;cursor:pointer;z-index:2;
  }
  .win.front .closebox{display:block;}
  .closebox:active{background:#000;}
  .wbody{flex:1;overflow:hidden;position:relative;font-size:12px;}

  /* finder window */
  .finder-body{padding:10px 6px;display:flex;flex-wrap:wrap;align-content:flex-start;}
  .ficon{width:72px;text-align:center;margin:2px 0;cursor:default;}
  .ficon .pic{display:inline-block;image-rendering:pixelated;}
  .ficon .lbl{font-size:10px;font-weight:700;line-height:12px;display:inline-block;padding:0 2px;}
  .ficon.sel .pic{filter:invert(1);}
  .ficon.sel .lbl{background:#000;color:#fff;}
  .finder-info{
    height:14px;border-bottom:1px solid #000;font-size:9px;font-weight:700;
    display:flex;justify-content:space-between;padding:1px 8px;flex:none;
  }

  /* dialogs */
  .dlg{
    position:absolute;background:#fff;border:2px solid #000;outline:1px solid #000;outline-offset:2px;
    z-index:9000;padding:14px 16px 12px;font-size:12px;font-weight:700;
  }
  .dlg .btnrow{margin-top:12px;text-align:right;}
  .btn{
    font:inherit;font-size:12px;font-weight:700;background:#fff;border:1px solid #000;border-radius:8px;
    padding:2px 16px;cursor:pointer;margin-left:8px;
  }
  .btn.def{box-shadow:0 0 0 1px #fff, 0 0 0 3px #000;border-radius:9px;}
  .btn:active{background:#000;color:#fff;}

  /* notepad */
  .note-ta{
    width:100%;height:100%;border:none;resize:none;outline:none;
    font-family:Geneva,Helvetica,Arial,sans-serif;font-size:11px;padding:6px 8px;
    background:#fff;color:#000;-webkit-user-select:text;user-select:text;
  }

  /* calculator */
  .calc{padding:6px;background:#fff;}
  .calc-display{
    border:1px solid #000;background:#fff;height:24px;font-size:15px;font-weight:700;
    display:flex;align-items:center;justify-content:flex-end;padding:0 6px;margin-bottom:6px;
    font-variant-numeric:tabular-nums;overflow:hidden;
  }
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
  .ckey{
    font:inherit;font-size:13px;font-weight:700;background:#fff;border:1px solid #000;
    box-shadow:1px 1px 0 #000;height:22px;cursor:pointer;
  }
  .ckey:active{background:#000;color:#fff;}
  .ckey.wide{grid-column:span 2;}

  /* paint */
  .paint-wrap{display:flex;height:100%;}
  .paint-tools{
    width:38px;border-right:1px solid #000;display:grid;grid-template-columns:1fr 1fr;
    grid-auto-rows:19px;flex:none;
  }
  .ptool{
    border-right:1px solid #000;border-bottom:1px solid #000;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:11px;background:#fff;
  }
  .ptool:nth-child(2n){border-right:none;}
  .ptool.sel{background:#000;color:#fff;}
  .ptool svg{display:block;}
  .ptool.sel svg *{stroke:#fff;fill:#fff;}
  .paint-canvas-wrap{flex:1;position:relative;background:#fff;}
  #paintcv{position:absolute;inset:0;cursor:crosshair;}

  /* puzzle */
  .pz{padding:8px;display:grid;grid-template-columns:repeat(4,34px);grid-template-rows:repeat(4,34px);gap:2px;background:#fff;}
  .pztile{
    border:1px solid #000;box-shadow:1px 1px 0 #000;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;cursor:pointer;background:#fff;
  }
  .pztile.empty{border:none;box-shadow:none;cursor:default;background:transparent;}
  .pz-msg{text-align:center;font-size:10px;font-weight:700;padding:2px 0 6px;}

  /* clock */
  .clockbody{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:2px;}
  .clock-time{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
  .clock-date{font-size:11px;font-weight:700;}

  /* shutdown scene */
  #scene-off{background:#000;}
</style>
</head>
<body>

<div id="machine">
  <div id="bezel">
    <div id="crt">
      <div id="screen">
        <!-- OFF -->
        <div class="scene active" id="scene-off"></div>

        <!-- BOOT -->
        <div class="scene" id="scene-boot">
          <div id="boot-icon"></div>
          <div id="boot-msg" style="display:none">Welcome</div>
        </div>

        <!-- DESKTOP -->
        <div class="scene" id="scene-desktop">
          <div id="menubar"></div>
          <div id="icons-layer"></div>
          <div id="windows-layer"></div>
        </div>
      </div>
      <div id="glass"></div>
    </div>
  </div>
  <div id="chin">
    <div id="brand"><b>Macintosh</b>&nbsp; 128K</div>
    <div id="floppy"></div>
  </div>
  <div id="power-wrap"><button id="power" title="Power"></button></div>
  <div id="power-label">POWER</div>
  <div id="hint">Flip the switch on the right side to boot &nbsp;→</div>
</div>

<script>
"use strict";

/* ---------- pixel-art helper: draw icons from ascii maps ---------- */
function pixIcon(map, scale, fg){
  const rows = map.trim().split("\n");
  const h = rows.length, w = Math.max(...rows.map(r=>r.length));
  const c = document.createElement("canvas");
  c.width = w*scale; c.height = h*scale;
  const g = c.getContext("2d");
  g.fillStyle = fg || "#000";
  for(let y=0;y<h;y++)for(let x=0;x<rows[y].length;x++){
    const ch = rows[y][x];
    if(ch==="#"){ g.fillRect(x*scale,y*scale,scale,scale); }
    else if(ch==="."){ g.fillStyle="#fff"; g.fillRect(x*scale,y*scale,scale,scale); g.fillStyle=fg||"#000"; }
  }
  return c;
}

/* ---------- clock: it is January 24, 1984 ---------- */
const EPOCH_1984 = new Date(1984,0,24,9,0,0).getTime();
const bootReal = Date.now();
function macNow(){ return new Date(EPOCH_1984 + (Date.now()-bootReal)); }

/* ---------- audio ---------- */
let actx = null;
function bootBeep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
    g.connect(actx.destination);
    [392.0, 523.25, 659.25].forEach(f=>{
      const o = actx.createOscillator();
      o.type="square"; o.frequency.value=f;
      const og = actx.createGain(); og.gain.value=0.33;
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t+1.15);
    });
  }catch(e){}
}
function clickTick(){
  try{
    if(!actx) return;
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type="square"; o.frequency.value=880;
    g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.05);
  }catch(e){}
}

/* ---------- scene control ---------- */
const scenes = {off:sceneEl("scene-off"), boot:sceneEl("scene-boot"), desktop:sceneEl("scene-desktop")};
function sceneEl(id){return document.getElementById(id);}
function showScene(name){
  Object.values(scenes).forEach(s=>s.classList.remove("active"));
  scenes[name].classList.add("active");
}

let powered = false;
let bootTimers = [];
const powerBtn = document.getElementById("power");
powerBtn.addEventListener("click", ()=>{
  powered ? shutDown() : boot();
});

function boot(){
  powered = true;
  powerBtn.classList.add("on");
  document.getElementById("hint").style.display="none";
  showScene("boot");
  const iconHost = document.getElementById("boot-icon");
  iconHost.innerHTML="";
  const msg = document.getElementById("boot-msg");
  msg.style.display="none";
  bootBeep();
  bootTimers.push(setTimeout(()=>{
    iconHost.appendChild(pixIcon(ICONS.mac,4));
  }, 700));
  bootTimers.push(setTimeout(()=>{ msg.style.display="block"; }, 1600));
  bootTimers.push(setTimeout(()=>{ buildDesktop(); showScene("desktop"); }, 3000));
}

function shutDown(){
  powered = false;
  powerBtn.classList.remove("on");
  bootTimers.forEach(clearTimeout); bootTimers=[];
  closeAllWindows();
  showScene("off");
}

/* ---------- desktop ---------- */
const menubar = document.getElementById("menubar");
const iconsLayer = document.getElementById("icons-layer");
const winLayer = document.getElementById("windows-layer");
let desktopBuilt = false;

const MENUS = [
  {t:"\u2318", items:[
    {l:"About the Finder\u2026", fn:()=>aboutDialog()},
    {sep:true},
    {l:"Alarm Clock", fn:()=>openClock()},
    {l:"Calculator", fn:()=>openCalc()},
    {l:"Note Pad", fn:()=>openNotes()},
    {l:"Puzzle", fn:()=>openPuzzle()},
  ]},
  {t:"File", items:[
    {l:"Open", fn:()=>openSelected()},
    {l:"Duplicate", dim:true},
    {l:"Get Info", dim:true},
    {sep:true},
    {l:"Close", fn:()=>closeFront()},
    {sep:true},
    {l:"Eject", fn:()=>alertBox("Please do not remove the\nstartup disk.")},
  ]},
  {t:"Edit", items:[
    {l:"Undo", dim:true},{sep:true},
    {l:"Cut", dim:true},{l:"Copy", dim:true},{l:"Paste", dim:true},{l:"Clear", dim:true},
  ]},
  {t:"View", items:[
    {l:"\u2713 by Icon"},{l:"by Name", dim:true},{l:"by Date", dim:true},{l:"by Size", dim:true},
  ]},
  {t:"Special", items:[
    {l:"Clean Up", fn:()=>cleanUpIcons()},
    {l:"Empty Trash", fn:()=>alertBox("The Trash contains no items.")},
    {sep:true},
    {l:"Shut Down", fn:()=>shutDown()},
  ]},
];

let openMenu = null;
function buildMenubar(){
  menubar.innerHTML="";
  MENUS.forEach(m=>{
    const t = document.createElement("div");
    t.className="menu-title"; t.textContent=m.t;
    const dd = document.createElement("div");
    dd.className="dropdown";
    m.items.forEach(it=>{
      if(it.sep){ const s=document.createElement("div"); s.className="msep"; dd.appendChild(s); return; }
      const mi=document.createElement("div");
      mi.className="mi"+(it.dim?" dim":"");
      mi.textContent=it.l;
      mi.addEventListener("click",e=>{
        e.stopPropagation();
        closeMenus();
        if(!it.dim && it.fn){ clickTick(); it.fn(); }
      });
      dd.appendChild(mi);
    });
    t.appendChild(dd);
    t.addEventListener("click",e=>{
      e.stopPropagation();
      const wasOpen = t.classList.contains("open");
      closeMenus();
      if(!wasOpen){
        t.classList.add("open");
        dd.classList.add("show");
        dd.style.left = "0px";
        openMenu = t;
      }
    });
    menubar.appendChild(t);
  });
  document.getElementById("screen").addEventListener("click",()=>closeMenus());
}
function closeMenus(){
  menubar.querySelectorAll(".menu-title").forEach(t=>t.classList.remove("open"));
  menubar.querySelectorAll(".dropdown").forEach(d=>d.classList.remove("show"));
  openMenu = null;
}

/* desktop icons */
let selectedIcon = null;
function makeDesktopIcon(name, iconKey, x, y, openFn){
  const el = document.createElement("div");
  el.className="dicon"; el.style.left=x+"px"; el.style.top=y+"px";
  const pic=document.createElement("span"); pic.className="pic";
  pic.appendChild(pixIcon(ICONS[iconKey],2));
  const lbl=document.createElement("span"); lbl.className="lbl"; lbl.textContent=name;
  el.appendChild(pic); el.appendChild(document.createElement("br")); el.appendChild(lbl);
  el.addEventListener("click",e=>{
    e.stopPropagation();
    selectIcon(el, openFn);
  });
  el.addEventListener("dblclick",e=>{ e.stopPropagation(); openFn(); });
  iconsLayer.appendChild(el);
  return el;
}
function selectIcon(el, openFn){
  if(selectedIcon) selectedIcon.classList.remove("sel");
  selectedIcon = el; el.classList.add("sel");
  selectedIcon._open = openFn;
}
function openSelected(){
  if(selectedIcon && selectedIcon._open) selectedIcon._open();
  else if(!frontWin) alertBox("Please select an icon first.");
}
function cleanUpIcons(){
  const disk = iconsLayer.children[0], trash = iconsLayer.children[1];
  if(disk){ disk.style.left="438px"; disk.style.top="30px"; }
  if(trash){ trash.style.left="438px"; trash.style.top="278px"; }
}

function buildDesktop(){
  if(desktopBuilt) { return; }
  desktopBuilt = true;
  buildMenubar();
  makeDesktopIcon("System Disk","disk",438,30,openFinder);
  makeDesktopIcon("Trash","trash",438,278,()=>alertBox("The Trash contains no items."));
  iconsLayer.parentElement.addEventListener("click",()=>{
    if(selectedIcon){selectedIcon.classList.remove("sel");selectedIcon=null;}
  });
  setTimeout(openFinder, 350);
}

/* ---------- window manager ---------- */
let zTop = 100;
let frontWin = null;
const openWins = new Set();

function createWindow(title, w, h, x, y){
  const win = document.createElement("div");
  win.className="win";
  win.style.width=w+"px"; win.style.height=h+"px";
  win.style.left=x+"px"; win.style.top=y+"px";
  const tbar=document.createElement("div"); tbar.className="tbar";
  const cb=document.createElement("div"); cb.className="closebox";
  const ttl=document.createElement("div"); ttl.className="ttl"; ttl.textContent=title;
  tbar.appendChild(cb); tbar.appendChild(ttl);
  const body=document.createElement("div"); body.className="wbody";
  win.appendChild(tbar); win.appendChild(body);
  winLayer.appendChild(win);
  openWins.add(win);

  cb.addEventListener("click",e=>{e.stopPropagation();closeWindow(win);});
  win.addEventListener("mousedown",()=>bringFront(win));

  /* drag */
  let drag=null;
  tbar.addEventListener("mousedown",e=>{
    if(e.target===cb) return;
    bringFront(win);
    const s = getScale();
    drag={sx:e.clientX, sy:e.clientY, ox:parseInt(win.style.left), oy:parseInt(win.style.top), s};
    e.preventDefault();
  });
  window.addEventListener("mousemove",e=>{
    if(!drag) return;
    let nx = drag.ox + (e.clientX-drag.sx)/drag.s;
    let ny = drag.oy + (e.clientY-drag.sy)/drag.s;
    nx = Math.max(-w+40, Math.min(492, nx));
    ny = Math.max(20, Math.min(330, ny));
    win.style.left=nx+"px"; win.style.top=ny+"px";
  });
  window.addEventListener("mouseup",()=>{drag=null;});

  bringFront(win);
  return {win, body, close:()=>closeWindow(win)};
}
function bringFront(win){
  zTop++; win.style.zIndex=zTop;
  if(frontWin) frontWin.classList.remove("front");
  frontWin = win; win.classList.add("front");
}
function closeWindow(win){
  openWins.delete(win);
  if(win._onclose) win._onclose();
  win.remove();
  if(frontWin===win){
    frontWin=null;
    let best=null;
    openWins.forEach(w=>{ if(!best || +w.style.zIndex > +best.style.zIndex) best=w; });
    if(best) bringFront(best);
  }
}
function closeFront(){ if(frontWin) closeWindow(frontWin); }
function closeAllWindows(){ Array.from(openWins).forEach(closeWindow); }
function getScale(){
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--s"))||1.35;
}

/* singleton helper */
const singles = {};
function single(key, maker){
  if(singles[key] && openWins.has(singles[key])){ bringFront(singles[key]); return null; }
  const made = maker();
  singles[key]=made.win;
  return made;
}

/* ---------- Finder ---------- */
function openFinder(){
  const made = single("finder", ()=>createWindow("System Disk", 330, 210, 40, 40));
  if(!made) return;
  const {body} = made;
  const info=document.createElement("div"); info.className="finder-info";
  info.innerHTML="<span>5 items</span><span>232K in disk</span><span>168K available</span>";
  const fb=document.createElement("div"); fb.className="finder-body";
  body.style.display="flex"; body.style.flexDirection="column";
  body.appendChild(info); body.appendChild(fb);

  const apps=[
    ["Paint","paint",openPaint],
    ["Note Pad","note",openNotes],
    ["Calculator","calc",openCalc],
    ["Puzzle","puzzle",openPuzzle],
    ["Alarm Clock","clock",openClock],
  ];
  let fsel=null;
  apps.forEach(([name,key,fn])=>{
    const el=document.createElement("div"); el.className="ficon";
    const pic=document.createElement("span"); pic.className="pic";
    pic.appendChild(pixIcon(ICONS[key],2));
    const lbl=document.createElement("span"); lbl.className="lbl"; lbl.textContent=name;
    el.appendChild(pic); el.appendChild(document.createElement("br")); el.appendChild(lbl);
    el.addEventListener("click",e=>{
      e.stopPropagation();
      if(fsel) fsel.classList.remove("sel");
      fsel=el; el.classList.add("sel");
      if(selectedIcon){selectedIcon.classList.remove("sel");}
      selectedIcon = el; el._open=fn; selectedIcon._open=fn;
    });
    el.addEventListener("dblclick",e=>{e.stopPropagation(); fn();});
    fb.appendChild(el);
  });
}

/* ---------- Calculator ---------- */
function openCalc(){
  const made = single("calc", ()=>createWindow("Calculator", 130, 208, 350, 50));
  if(!made) return;
  const c=document.createElement("div"); c.className="calc";
  const disp=document.createElement("div"); disp.className="calc-display"; disp.textContent="0";
  const grid=document.createElement("div"); grid.className="calc-grid";
  c.appendChild(disp); c.appendChild(grid);
  made.body.appendChild(c);

  let acc=null, op=null, cur="0", fresh=true;
  function show(){ disp.textContent = cur.length>11 ? Number(cur).toExponential(5) : cur; }
  function digit(d){
    if(fresh){cur = d==="."?"0.":d; fresh=false;}
    else if(d==="." && cur.includes(".")) return;
    else cur += d;
    show();
  }
  function apply(){
    if(op===null || acc===null) return;
    const b=parseFloat(cur);
    let r=acc;
    if(op==="+") r=acc+b; if(op==="-") r=acc-b;
    if(op==="*") r=acc*b; if(op==="/") r= b===0 ? NaN : acc/b;
    cur = (Math.round(r*1e10)/1e10).toString();
    acc=null; op=null; show();
  }
  function setOp(o){
    if(op && !fresh) apply();
    acc=parseFloat(cur); op=o; fresh=true;
  }
  const keys=[
    ["C",()=>{acc=null;op=null;cur="0";fresh=true;show();}],
    ["/",()=>setOp("/")],["*",()=>setOp("*")],["-",()=>setOp("-")],
    ["7",()=>digit("7")],["8",()=>digit("8")],["9",()=>digit("9")],["+",()=>setOp("+")],
    ["4",()=>digit("4")],["5",()=>digit("5")],["6",()=>digit("6")],
    ["=",()=>{apply();fresh=true;},"tall"],
    ["1",()=>digit("1")],["2",()=>digit("2")],["3",()=>digit("3")],
    ["0",()=>digit("0"),"wide"],[".",()=>digit(".")],
  ];
  keys.forEach(([label,fn,mod])=>{
    const b=document.createElement("button");
    b.className="ckey"+(mod==="wide"?" wide":"");
    if(mod==="tall"){ b.style.gridRow="span 2"; b.style.height="auto"; }
    b.textContent=label;
    b.addEventListener("click",()=>{clickTick();fn();});
    grid.appendChild(b);
  });
}

/* ---------- Paint ---------- */
function openPaint(){
  const made = single("paint", ()=>createWindow("Paint", 340, 230, 60, 60));
  if(!made) return;
  const wrap=document.createElement("div"); wrap.className="paint-wrap";
  const tools=document.createElement("div"); tools.className="paint-tools";
  const cvwrap=document.createElement("div"); cvwrap.className="paint-canvas-wrap";
  const cv=document.createElement("canvas"); cv.id="paintcv";
  wrap.appendChild(tools); wrap.appendChild(cvwrap); cvwrap.appendChild(cv);
  made.body.appendChild(wrap);

  const CW=300, CH=209;
  cv.width=CW; cv.height=CH;
  cv.style.width="100%"; cv.style.height="100%";
  const g=cv.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,CW,CH);
  g.imageSmoothingEnabled=false;

  const TOOLS=[
    ["pencil","✏"],["line","╱"],["rect","▭"],["frect","▮"],
    ["oval","◯"],["eraser","▢"],["spray","∴"],["clear","✕"],
  ];
  let tool="pencil";
  const btns={};
  TOOLS.forEach(([id,glyph])=>{
    const t=document.createElement("div"); t.className="ptool"; t.textContent=glyph; t.title=id;
    t.addEventListener("click",()=>{
      if(id==="clear"){ g.fillStyle="#fff"; g.fillRect(0,0,CW,CH); return; }
      tool=id;
      Object.values(btns).forEach(b=>b.classList.remove("sel"));
      t.classList.add("sel");
    });
    tools.appendChild(t); btns[id]=t;
  });
  btns.pencil.classList.add("sel");

  let down=false, sx=0, sy=0, snap=null;
  function pos(e){
    const r=cv.getBoundingClientRect();
    return {x:(e.clientX-r.left)*CW/r.width, y:(e.clientY-r.top)*CH/r.height};
  }
  cv.addEventListener("mousedown",e=>{
    down=true; const p=pos(e); sx=p.x; sy=p.y;
    snap=g.getImageData(0,0,CW,CH);
    if(tool==="pencil"||tool==="eraser"){ dot(p.x,p.y); }
    if(tool==="spray"){ spray(p.x,p.y); }
    e.preventDefault();
  });
  cv.addEventListener("mousemove",e=>{
    if(!down) return;
    const p=pos(e);
    if(tool==="pencil"||tool==="eraser"){
      g.strokeStyle = tool==="eraser" ? "#fff" : "#000";
      g.lineWidth = tool==="eraser" ? 10 : 1.6;
      g.lineCap="round";
      g.beginPath(); g.moveTo(sx,sy); g.lineTo(p.x,p.y); g.stroke();
      sx=p.x; sy=p.y;
    } else if(tool==="spray"){
      spray(p.x,p.y);
    } else {
      g.putImageData(snap,0,0);
      preview(p.x,p.y);
    }
  });
  window.addEventListener("mouseup",()=>{down=false;});
  function dot(x,y){
    g.fillStyle = tool==="eraser" ? "#fff":"#000";
    const r = tool==="eraser"?5:1;
    g.fillRect(x-r/2,y-r/2,r,r);
  }
  function spray(x,y){
    g.fillStyle="#000";
    for(let i=0;i<14;i++){
      const a=Math.random()*Math.PI*2, d=Math.random()*9;
      g.fillRect(x+Math.cos(a)*d, y+Math.sin(a)*d, 1,1);
    }
  }
  function preview(x,y){
    g.strokeStyle="#000"; g.fillStyle="#000"; g.lineWidth=1.6;
    g.beginPath();
    if(tool==="line"){ g.moveTo(sx,sy); g.lineTo(x,y); g.stroke(); }
    if(tool==="rect"){ g.strokeRect(Math.min(sx,x),Math.min(sy,y),Math.abs(x-sx),Math.abs(y-sy)); }
    if(tool==="frect"){ g.fillRect(Math.min(sx,x),Math.min(sy,y),Math.abs(x-sx),Math.abs(y-sy)); }
    if(tool==="oval"){
      g.ellipse((sx+x)/2,(sy+y)/2,Math.abs(x-sx)/2,Math.abs(y-sy)/2,0,0,Math.PI*2); g.stroke();
    }
  }
}

/* ---------- Puzzle ---------- */
function openPuzzle(){
  const made = single("puzzle", ()=>createWindow("Puzzle", 164, 208, 320, 116));
  if(!made) return;
  const msg=document.createElement("div"); msg.className="pz-msg"; msg.innerHTML="&nbsp;";
  const grid=document.createElement("div"); grid.className="pz";
  made.body.appendChild(grid); made.body.appendChild(msg);

  let tiles=[...Array(15).keys()].map(n=>n+1); tiles.push(0);
  /* shuffle by random legal moves → always solvable */
  for(let i=0;i<300;i++){
    const e=tiles.indexOf(0);
    const opts=[];
    if(e%4>0)opts.push(e-1); if(e%4<3)opts.push(e+1);
    if(e>3)opts.push(e-4); if(e<12)opts.push(e+4);
    const j=opts[Math.floor(Math.random()*opts.length)];
    [tiles[e],tiles[j]]=[tiles[j],tiles[e]];
  }
  function render(){
    grid.innerHTML="";
    tiles.forEach((v,i)=>{
      const t=document.createElement("div");
      t.className="pztile"+(v===0?" empty":"");
      t.textContent=v||"";
      t.addEventListener("click",()=>{
        const e=tiles.indexOf(0);
        const legal = (i===e-1&&e%4>0)||(i===e+1&&e%4<3)||(i===e-4)||(i===e+4);
        if(legal){
          [tiles[e],tiles[i]]=[tiles[i],tiles[e]];
          clickTick(); render();
          if(tiles.slice(0,15).every((v2,k)=>v2===k+1)) msg.textContent="Solved. Nice work!";
        }
      });
      grid.appendChild(t);
    });
  }
  render();
}

/* ---------- Alarm Clock ---------- */
function openClock(){
  const made = single("clock", ()=>createWindow("Alarm Clock", 190, 90, 290, 220));
  if(!made) return;
  const b=document.createElement("div"); b.className="clockbody";
  const t=document.createElement("div"); t.className="clock-time";
  const d=document.createElement("div"); d.className="clock-date";
  b.appendChild(t); b.appendChild(d); made.body.appendChild(b);
  const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
  function tick(){
    const n=macNow();
    let h=n.getHours(); const ap=h>=12?"PM":"AM"; h=h%12||12;
    t.textContent = h+":"+String(n.getMinutes()).padStart(2,"0")+":"+String(n.getSeconds()).padStart(2,"0")+" "+ap;
    d.textContent = DAYS[n.getDay()]+", "+MON[n.getMonth()]+" "+n.getDate()+", "+n.getFullYear();
  }
  tick();
  const iv=setInterval(tick,500);
  made.win._onclose=()=>clearInterval(iv);
}

/* ---------- responsive scale ---------- */
function fit(){
  const pad = 140;
  const availW = window.innerWidth - pad;
  const availH = window.innerHeight - pad;
  /* machine chrome adds roughly 130px width, 130px height around the crt */
  let s = Math.min((availW-130)/512, (availH-150)/342);
  s = Math.max(0.7, Math.min(2, s));
  document.documentElement.style.setProperty("--s", s.toFixed(3));
}
window.addEventListener("resize", fit);
fit();
